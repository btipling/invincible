# Vercel Workflows smoke (backend-agents D, plan #785 / source issue #767).
#
# Operator: Actions → workflows-smoke → Run workflow
#   inputs: confirm=smoke (required); url=optional deployed-URL health probe
#           (never hardcoded host). Smoke ALWAYS targets Vercel Production — we
#           do not use or build a preview environment, so there is no choice.
#
# Proves Vercel Workflows is ENABLED + usable on Vercel Production by
# driving start → getRun → completed for the trivial fixture, against the
# Vercel Workflows API via the SDK's Vercel World using the EXISTING repo
# secrets (VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID — dual-stored for
# sandbox). NO new secret. A server-side GHA has no browser session cookie, so
# it must NOT call the authed /api/workflows/smoke route (that route stays the
# human/dashboard surface — plan-review lock on #785).
#
# Fail closed: confirm mismatch aborts; any required secret missing aborts;
# start/getRun throw → non-zero; run 'completed' is the only zero exit. NEVER a
# fallback to the tab-owned /api/agent POST (the #710 lie). Pending at the poll
# budget = non-zero ("run still pending", re-dispatch) — never a silent pass.
#
# Safety: workflow_dispatch only; ubuntu-latest only; never self-hosted; never
# echo secret values. GitHub expression substitution (`${{ inputs.* }}`) is NOT
# shell-escaped, so dispatch inputs are never interpolated into a `run:` script
# body — they are passed through `env:` (expression context, not shell) and
# referenced as quoted `"$VAR"` inside scripts. `${{ }}` appears only in
# `if:`/`name:`/`env:` positions (checked by scripts/workflows-smoke.gha.test.ts).

name: workflows-smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Must equal "smoke" to run (misclick guard)'
        required: true
        type: string
      url:
        description: 'Optional deployed-URL to health-probe first. Empty = skip. Never hardcoded.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: workflows-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  smoke:
    # Smoke always targets Vercel Production (no preview env is used/built), so
    # there is no environment choice to wire here.
    name: workflows smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dispatch inputs are mapped into env (expression context — NOT shell).
    # Scripts reference the quoted env vars below, never `${{ inputs.* }}`.
    env:
      SMOKE_CONFIRM: ${{ inputs.confirm }}
      SMOKE_URL: ${{ inputs.url }}
    steps:
      - name: Guard confirm input
        run: |
          set -euo pipefail
          if [ "$SMOKE_CONFIRM" != "smoke" ]; then
            echo "::error::confirm input must equal 'smoke'. Aborting with no mutate."
            exit 1
          fi

      - name: Fail closed — required secrets present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }
          for name in VERCEL_TOKEN VERCEL_PROJECT_ID VERCEL_TEAM_ID; do
            eval "val=\$(trim \"\${$name:-}\")"
            if [ -z "${val}" ]; then
              echo "::error::${name} is missing or empty (set repository secret; never commit values)"
              exit 1
            fi
            echo "${name} present (value not printed)."
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Optional deployment reachability probe
        if: ${{ inputs.url != '' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 -o /dev/null "$SMOKE_URL"
          echo "Deployment reachable at provided url."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run Vercel Workflows fixture smoke
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # Bounded poll budget + interval (plan #785 Caps table).
          WORKFLOWS_SMOKE_POLL_TIMEOUT_MS: "120000"
          WORKFLOWS_SMOKE_POLL_INTERVAL_MS: "2000"
        run: |
          set -euo pipefail
          npx tsx scripts/workflows-smoke.ts

      - name: Job summary
        if: ${{ always() && inputs.confirm == 'smoke' }}
        run: |
          set -euo pipefail
          {
            echo "### workflows-smoke (production)"
            echo "- result: ${{ job.status }}"
            echo "- verify: Vercel → Observability → Workflows shows the fixture run + step, status completed."
            echo "- note: requires Workflows ENABLED on Vercel + Observability on (hosted-UI toggles); never falls back to /api/agent."
          } >> "${GITHUB_STEP_SUMMARY}"
