# Compile harness.wasm; upload Actions artifact for Vercel prebuild.
# Public-repo safety:
#   - default: self-hosted (opt-in vars.SELF_HOSTED_BUILDS or origin grandfather)
#   - workflow_dispatch can force ubuntu-latest (Zig freestanding — no DO runner needed)
#   - push main / workflow_dispatch always (path-filtered)
#   - pull_request: same-repo head only (contributors with push access); never forks
#   - never pull_request_target
#   - never upload production artifact name `harness-wasm` except on `main`
#     (push or workflow_dispatch --ref main) — PR heads used to share that
#     name and win fetch-harness `latest`, shipping unmerged Zig to Production
#   - never Vercel deploy hook on PR
name: build-harness

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to build (ubuntu-latest when DO runner is offline)"
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
        default: self-hosted
  push:
    branches: [main]
    paths:
      - "native/harness/**"
      - "native/ZIG_VERSION"
      - ".github/workflows/build-harness.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/harness/**"
      - "native/ZIG_VERSION"
      - ".github/workflows/build-harness.yml"

# Fork PRs: head.repo != github.repository → job if: skips (no untrusted code on DO).
# Same-repo PRs: trusted branch authors (write access); still no deploy hook.
concurrency:
  group: build-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: zig → harness.wasm
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.runner == 'ubuntu-latest'
      ) ||
      (
        (vars.SELF_HOSTED_BUILDS == 'true' || github.repository == 'btipling/invincible') &&
        (
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)
          )
        )
      )
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON(vars.RUNNER_LABELS || '["self-hosted","invincible","zig"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Zig (pinned)
        run: |
          set -euo pipefail
          PIN="$(tr -d '[:space:]' < native/ZIG_VERSION)"
          export PATH="/usr/local/bin:${HOME}/.local/bin:${PATH}"
          if command -v zig >/dev/null 2>&1 && [[ "$(zig version)" == "$PIN" ]]; then
            zig version
            exit 0
          fi
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ZIG_ARCH=x86_64-linux ;;
            aarch64|arm64) ZIG_ARCH=aarch64-linux ;;
            *) echo "unsupported arch $ARCH" >&2; exit 1 ;;
          esac
          TMP="$(mktemp -d)"
          URL="https://ziglang.org/download/${PIN}/zig-${ZIG_ARCH}-${PIN}.tar.xz"
          echo "installing Zig ${PIN} from ${URL}"
          curl -fsSL "$URL" -o "$TMP/zig.tar.xz"
          tar -xJf "$TMP/zig.tar.xz" -C "$TMP"
          mkdir -p "${HOME}/.local/bin"
          ZIG_DIR="$(echo "$TMP"/zig-*)"
          ln -sfn "${ZIG_DIR}/zig" "${HOME}/.local/bin/zig"
          # Also try system path when we have write access (self-hosted).
          if [[ -w /usr/local/bin ]]; then
            ln -sfn "${ZIG_DIR}/zig" /usr/local/bin/zig || true
          fi
          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"
          zig version
          test "$(zig version)" = "$PIN"

      - name: Host unit tests (rich/*)
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"
          zig version
          test "$(zig version)" = "$(tr -d '[:space:]' < native/ZIG_VERSION)"
          cd native/harness
          zig build test-rich

      # Non-blocking drift-guards for still-OPEN rich bugs (#336/#341/#343) and
      # #387 host/whitespace pins. Runs on every native/harness/** change (path
      # filter above includes native/harness/src/rich/**) but never blocks the
      # release gate: these encode current-behavior snapshots of OPEN bugs, so a
      # failure here is a deliberate intent-to-drift signal, not a merge block.
      - name: Host invariants (rich/* drift-guards, non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"
          zig version
          test "$(zig version)" = "$(tr -d '[:space:]' < native/ZIG_VERSION)"
          cd native/harness
          zig build test-rich-invariants

      - name: Build harness
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"
          zig version
          test "$(zig version)" = "$(tr -d '[:space:]' < native/ZIG_VERSION)"
          ./native/harness/build.sh

      - name: Record sizes
        run: |
          set -euo pipefail
          STAGE=native/dist/harness
          ls -la "$STAGE"
          echo "harness.wasm bytes=$(wc -c < "$STAGE/harness.wasm" | tr -d ' ')"
          echo "web.js bytes=$(wc -c < "$STAGE/web.js" | tr -d ' ')"
          head -c 4 "$STAGE/harness.wasm" | od -An -tx1

      - name: Upload harness-wasm artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: harness-wasm
          path: |
            native/dist/harness/harness.wasm
            native/dist/harness/web.js
            native/dist/harness/index.html
            native/dist/harness/build-id.txt
            native/dist/harness/build-id-full.txt
          if-no-files-found: error
          retention-days: 14

      # Production redeploy only on main (or manual dispatch) — never on PR.
      - name: Trigger Vercel redeploy (optional)
        if: github.event_name != 'pull_request'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "WARN: VERCEL_DEPLOY_HOOK_URL empty — skip hook; fetch-harness wait-for-SHA still applies"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
          echo "deploy hook pinged after artifact upload"
