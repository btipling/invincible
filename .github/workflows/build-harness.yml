# Compile harness.wasm on trusted self-hosted runner; upload Actions artifact.
# Public-repo safety: no pull_request; opt-in vars.SELF_HOSTED_BUILDS (or origin
# grandfather btipling/invincible) + main / workflow_dispatch only.
name: build-harness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/harness/**"
      - "native/ZIG_VERSION"
      - ".github/workflows/build-harness.yml"

# Never run untrusted PR code on the DO runner.
# forks: self-hosted runners are not shared to forks automatically; still refuse PRs.
concurrency:
  group: build-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: zig → harness.wasm
    if: >
      (vars.SELF_HOSTED_BUILDS == 'true' || github.repository == 'btipling/invincible') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","invincible","zig"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build harness
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          zig version
          test "$(zig version)" = "$(tr -d '[:space:]' < native/ZIG_VERSION)"
          ./native/harness/build.sh

      - name: Record sizes
        run: |
          set -euo pipefail
          STAGE=native/dist/harness
          ls -la "$STAGE"
          echo "harness.wasm bytes=$(wc -c < "$STAGE/harness.wasm" | tr -d ' ')"
          echo "web.js bytes=$(wc -c < "$STAGE/web.js" | tr -d ' ')"
          head -c 4 "$STAGE/harness.wasm" | od -An -tx1

      - name: Upload harness-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-wasm
          path: |
            native/dist/harness/harness.wasm
            native/dist/harness/web.js
            native/dist/harness/index.html
            native/dist/harness/build-id.txt
            native/dist/harness/build-id-full.txt
          if-no-files-found: error
          retention-days: 14

      - name: Trigger Vercel redeploy (optional)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "WARN: VERCEL_DEPLOY_HOOK_URL empty — skip hook; fetch-harness wait-for-SHA still applies"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
          echo "deploy hook pinged after artifact upload"
