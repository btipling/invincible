# Prove self-hosted runner health. No pull_request (public-repo safety).
name: runner-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-smoke.yml"

jobs:
  smoke:
    name: smoke on self-hosted
    if: >
      github.repository == 'btipling/invincible' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, invincible, zig]
    timeout-minutes: 10
    steps:
      - name: Host identity
        run: |
          set -euo pipefail
          hostname
          uname -a
          id
          echo "runner labels: self-hosted, invincible, zig"

      - name: Zig pin
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          command -v zig
          zig version
          test "$(zig version)" = "0.16.0"

      - name: Outbound GitHub
        run: |
          set -euo pipefail
          curl -fsSL -o /dev/null -w "github.com %{http_code}\n" https://github.com/

      - name: OK
        run: echo "runner-smoke OK"
