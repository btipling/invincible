# Prove self-hosted runner is online (no heavy build).
# Public-repo safety: no pull_request; opt-in vars.SELF_HOSTED_BUILDS (or origin
# grandfather btipling/invincible) + main / workflow_dispatch only.
name: runner-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-smoke.yml"

jobs:
  smoke:
    name: smoke on self-hosted
    if: >
      (vars.SELF_HOSTED_BUILDS == 'true' || github.repository == 'btipling/invincible') &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","invincible","zig"]') }}
    timeout-minutes: 10
    steps:
      - name: Host identity
        run: |
          set -euo pipefail
          hostname
          uname -a
          id
          echo "runner labels: self-hosted, invincible, zig"

      - name: Zig pin
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          command -v zig
          zig version
          test "$(zig version)" = "0.16.0"

      - name: Outbound GitHub
        run: |
          set -euo pipefail
          curl -fsSL -o /dev/null -w "github.com %{http_code}\n" https://github.com/

      - name: OK
        run: echo "runner-smoke OK"
