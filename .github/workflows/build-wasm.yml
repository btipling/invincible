# Placeholder / hello Wasm build on self-hosted runner.
# Public-repo safety: no pull_request; opt-in vars.SELF_HOSTED_BUILDS (or origin
# grandfather btipling/invincible) + main / workflow_dispatch only.
name: build-wasm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-wasm.yml"

jobs:
  wasm:
    name: zig → hello.wasm
    if: >
      (vars.SELF_HOSTED_BUILDS == 'true' || github.repository == 'btipling/invincible') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","invincible","zig"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          ./native/build.sh

      - name: Upload hello.wasm
        uses: actions/upload-artifact@v4
        with:
          name: hello-wasm
          path: native/dist/hello.wasm
          if-no-files-found: error
          retention-days: 14
