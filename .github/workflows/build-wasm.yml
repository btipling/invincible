# Placeholder hello.wasm on self-hosted runner.
# Public-repo safety: no pull_request; only this repo + main/dispatch.
name: build-wasm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-wasm.yml"

jobs:
  wasm:
    name: zig → hello.wasm
    if: >
      github.repository == 'btipling/invincible' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, invincible, zig]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:${PATH}"
          ./native/build.sh

      - name: Upload hello.wasm
        uses: actions/upload-artifact@v4
        with:
          name: hello-wasm
          path: native/dist/hello.wasm
          if-no-files-found: error
          retention-days: 14
